<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exam Scanner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Exam Scanner</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --text: #1b1f24; --muted: #5b6470; --border: #d7dbe1;
  --accent: #1f6feb; --accent-text: #ffffff; --ok: #1a7f37; --warn: #9a5700; --bad: #c62828;
  --chip: #eef1f5; --banner: #fff4e0; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #181c22; --text: #e8ebef; --muted: #9aa4b0; --border: #2b313a;
    --accent: #4c8dff; --accent-text: #0b0d10; --ok: #3fb950; --warn: #e3a13b; --bad: #ff6b6b;
    --chip: #222831; --banner: #2a2415; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #181c22; --text: #e8ebef; --muted: #9aa4b0; --border: #2b313a;
  --accent: #4c8dff; --accent-text: #0b0d10; --ok: #3fb950; --warn: #e3a13b; --bad: #ff6b6b;
  --chip: #222831; --banner: #2a2415; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; font: -apple-system-body; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.4; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; background: var(--bg); border-bottom: 1px solid var(--border); }
.bar h1 { font-size: 1.25rem; margin: 0; }
.bar-title { flex: 1; min-width: 0; text-align: right; }
.bar-title h1 { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-sub { color: var(--muted); font-size: .85rem; }
main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 820px; margin: 0 auto; }
main.with-tabs { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
h2 { font-size: 1.05rem; margin: 20px 0 8px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.section-head h2 { margin-bottom: 8px; }
.note { color: var(--muted); font-size: .9rem; }
.center { text-align: center; }
.muted { color: var(--muted); font-weight: 400; }
.warn-text { color: var(--warn); } .ok-text { color: var(--ok); }
button { appearance: none; border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px; box-shadow: var(--shadow); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--bad); }
button.ghost { background: none; border: none; box-shadow: none; color: var(--accent); padding: 8px 4px; }
button.link { background: none; border: none; box-shadow: none; color: var(--accent); padding: 0; min-height: 0; text-decoration: underline; font-weight: 600; }
button.small, a.small { min-height: 36px; padding: 6px 10px; font-size: .9rem; }
a.btnlink { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--accent); text-decoration: none; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.actions.col { flex-direction: column; } .actions.col button { width: 100%; }
.banner { background: var(--banner); border-left: 4px solid var(--warn); padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: .95rem; }
.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin: 4px 0 8px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px; font-weight: 400; min-height: 56px; }
.row.static { cursor: default; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; font-variant-numeric: tabular-nums; }
.rosterstat { flex-direction: row; gap: 10px; font-size: .88rem; color: var(--muted); }
.empty { color: var(--muted); padding: 12px; text-align: center; }
.chip { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; font-weight: 600; }
.chip.warn { color: var(--warn); } .chip.ok { color: var(--ok); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
.tabs button { flex: 1; border: none; box-shadow: none; background: none; border-radius: 8px; padding: 8px 2px; font-size: .85rem; color: var(--muted); position: relative; }
.tabs button.on { color: var(--accent); background: var(--chip); }
.badge { display: inline-block; margin-left: 4px; background: var(--warn); color: #fff; border-radius: 999px; font-size: .7rem; padding: 1px 6px; vertical-align: 1px; }
.viewer { position: relative; background: #000; border-radius: 12px; overflow: hidden; min-height: 220px; display: flex; align-items: center; justify-content: center; }
.viewer canvas { display: block; width: 100%; height: auto; max-height: 64vh; object-fit: contain; }
.placeholder { color: #c9d1d9; padding: 48px 16px; text-align: center; }
.hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(0,0,0,.72); color: #fff; padding: 6px 12px;
  border-radius: 999px; font-weight: 600; white-space: nowrap; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.hint.ok { background: rgba(26,127,55,.92); }
.count { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.72); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: .85rem; }
.seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: none; box-shadow: none; background: none; min-height: 38px; }
.seg button.on { background: var(--surface); box-shadow: var(--shadow); }
.keyrow { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-weight: 400; text-align: left; flex-wrap: wrap; }
.keyrow .kq { min-width: 86px; font-weight: 600; }
.keyrow .kk { font-weight: 700; font-size: 1.1rem; min-width: 32px; }
.keyrow.editing { border-color: var(--accent); }
.keyedit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.keyedit .letter { min-width: 44px; }
.keyedit .letter.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.keyedit-btns { display: flex; gap: 6px; margin-left: auto; }
.inline { display: inline-flex; align-items: center; gap: 6px; }
select, input[type=text], input:not([type]), input[inputmode] { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px; min-height: 40px; }
.form { display: grid; gap: 10px; }
.form label, label.field { display: grid; gap: 4px; font-weight: 600; font-size: .95rem; }
input[type=range] { width: 100%; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 12px) 12px 24px; }
.modal.open { display: block; }
.sheet { background: var(--bg); border-radius: 14px; max-width: 640px; margin: 0 auto; padding: 14px 16px 16px; }
.sheet.wide { max-width: 820px; }
.sheet h2 { margin-top: 4px; }
.sheet-top { display: flex; justify-content: space-between; }
.paper-title { margin: 4px 0 2px; }
.issue { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: 10px; padding: 10px 12px; margin: 8px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.issue.info { border-left-color: var(--muted); } .issue.ok { border-left-color: var(--ok); }
.issue ul { margin: 6px 0 0; padding-left: 20px; }
.issue-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.assign { display: flex; gap: 6px; flex-wrap: wrap; } .assign select { max-width: 100%; }
.imgwrap { position: relative; margin: 8px 0; }
.imgwrap img, .imgwrap canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
.imgwrap canvas { position: absolute; inset: 0; cursor: pointer; }
.idzoom { width: 100%; max-width: 480px; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
.errors li, .warnings li { margin: 4px 0; } .errors { color: var(--bad); }
.keytable { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .9rem; }
.keytable th, .keytable td { border-bottom: 1px solid var(--border); padding: 3px 4px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ok); color: #fff;
  padding: 10px 16px; border-radius: 12px; font-weight: 600; display: none; z-index: 30; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.toast.show { display: block; } .toast.warn { background: #9a5700; }
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<canvas id="camCanvas" hidden></canvas>
<video id="camVideo" playsinline muted autoplay hidden></video>
<script src="engine.js"></script>
<script src="logic.js"></script>
<script src="pdfgen.js"></script>
<script src="app.js"></script>
</body>
</html>
